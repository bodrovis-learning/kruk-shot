
name: GoReleaser

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: goreleaser-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: go.mod
          check-latest: false
          cache: false

      - name: Verify Go modules
        run: go mod verify

      - name: Install verified UPX
        shell: bash
        run: |
          set -euo pipefail

          UPX_VERSION="5.3.0"
          ARCHIVE="upx-${UPX_VERSION}-amd64_linux.tar.xz"
          SHA256="79cea8a50b6fa102d10c7b79a419cd77dead3cc2d78661de2dc5e5815dc505c1"

          TMP_DIR="$(mktemp -d)"
          trap 'rm -rf "$TMP_DIR"' EXIT

          curl --fail --location --silent --show-error \
            --output "$TMP_DIR/$ARCHIVE" \
            "https://github.com/upx/upx/releases/download/v${UPX_VERSION}/${ARCHIVE}"

          echo "${SHA256}  ${TMP_DIR}/${ARCHIVE}" | sha256sum --check -

          tar -xJf "$TMP_DIR/$ARCHIVE" -C "$TMP_DIR"

          sudo install -m 0755 \
            "$TMP_DIR/upx-${UPX_VERSION}-amd64_linux/upx" \
            /usr/local/bin/upx

          upx --version

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
